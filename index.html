<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chetona Publications | Home</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2300f3ff%22/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tiro+Bangla&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    
    <style>
        :root {
            --neon-accent: #00f3ff;
            --glass-bg: rgba(16, 21, 34, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(0, 0, 30, 0.8), rgba(0, 0, 0, 0.95)), url('bg-image.jpg') center/cover no-repeat fixed;
        }
        .bn-font { font-family: 'Tiro Bangla', serif; letter-spacing: 0.5px; }
        .main-content { padding: 3rem 2rem; flex: 1; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; }
        
        .branding {
            text-align: center; margin-bottom: 3rem; font-family: 'Cinzel', serif;
            font-size: 3rem; font-weight: 700; color: #ffffff; letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Catalog Grid */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        .book-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 243, 255, 0.2);
            border-color: var(--neon-accent);
        }

        .book-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .book-card h2 { font-size: 1.6rem; margin-bottom: 0.5rem; }
        .book-card p { color: var(--neon-accent); font-size: 1rem; margin-bottom: 1rem; }
        .book-card .price { font-weight: 600; color: #fff; margin-top: auto; font-size: 1.2rem; }

        footer { text-align: center; padding: 1.5rem; background: rgba(0, 0, 0, 0.5); border-top: 1px solid var(--glass-border); color: #94a3b8; font-size: 0.9rem; }
        footer span { color: var(--neon-accent); }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="container">
            <div class="branding">Chetona Publications</div>
            
            <div class="book-grid">
                <a href="book-chetonar-code.html" class="book-card">
                    <img src="book-cover.png" alt="চেতনার কোড">
                    <h2 class="bn-font">চেতনার কোড</h2>
                    <p class="bn-font">অভিক দত্ত</p>
                    <div class="price">৳150 / Download</div>
                </a>

                <a href="#" class="book-card">
                    <img src="book-cover-2.png" alt="বইয়ের নাম">
                    <h2 class="bn-font">অজানা নক্ষত্র</h2>
                    <p class="bn-font">অভিক দত্ত</p>
                    <div class="price">৳120 / Download</div>
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Chetona Publications. All rights reserved. | Designed by <span>Abhik Dutta</span></p>
    </footer>
</body>
</html>
